services:
  mysql:
    image: mysql:8.3
    container_name: chatapi-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chatapi
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - chatapi-mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: chatapi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - asiamsg-redis-data:/data

volumes:
  asiamsg-mysql-data:
  asiamsg-redis-data:
